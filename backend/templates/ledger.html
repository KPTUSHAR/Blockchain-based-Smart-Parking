<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blockchain Ledger</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body class="login-page dashboard-screen ledger-page-view">
    <div class="dashboard-wrapper ledger-wrapper">
      <div class="dashboard-container ledger-container">
        <!-- Navigation & Network Status Header -->
        <div class="ledger-nav-strip">
          <button
            type="button"
            class="btn-primary back-btn"
            onclick="window.location.href = '/dashboard'"
          >
            ← Back to Dashboard
          </button>
          <div class="ledger-status-pill">
            <span class="live-pulse"></span>
            NETWORK: <strong>SMART-CHAIN PROD</strong>
          </div>
        </div>

        <!-- Explorer Title & Metadata Metrics Strip -->
        <div class="ledger-header-panel">
          <h1 class="page-title">📒 Blockchain Transaction Ledger</h1>
          <p class="ledger-subtitle">
            Cryptographically signed block transactions and distributed parking
            settlements.
          </p>

          <div class="ledger-stats-grid">
            <div class="stat-pill">
              <span class="pill-label">CONSENSUS</span>
              <span class="pill-val">Proof of Authority</span>
            </div>
            <div class="stat-pill">
              <span class="pill-label">CRYPTOGRAPHY</span>
              <span class="pill-val">SHA-256</span>
            </div>
            <div class="stat-pill">
              <span class="pill-label">INTEGRITY</span>
              <span class="pill-val sync-status">Verified & Immutable</span>
            </div>
          </div>
        </div>

        <!-- Ledger Feed Container (Retains id="ledger" for fetchChain) -->
        <section class="section-box ledger-section">
          <div id="ledger" class="ledger-box"></div>
        </section>

        <!-- Footer -->
        <footer>© 2026 Smart Parking System | Cryptographically Secured</footer>
      </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
      // Auto-load blockchain ledger when page opens
      window.addEventListener("DOMContentLoaded", () => {
        if (typeof fetchChain === "function") {
          fetchChain();
        }
      });
    </script>
  </body>
</html>
